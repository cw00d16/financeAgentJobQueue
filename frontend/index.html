<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>financeAgentJobQueue</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #dcdde0;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #2f6feb;
    --accent-text: #ffffff;
    --danger: #c0392b;
    --ok: #1b7a3d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #1f2126;
      --border: #33353b;
      --text: #e7e8ea;
      --muted: #9aa0aa;
      --accent: #5b9dff;
      --accent-text: #0b1220;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 24px 20px 8px;
    max-width: 900px;
    margin: 0 auto;
  }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: 13px; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 12px 20px 60px;
    display: grid;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], textarea, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  textarea { min-height: 90px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
  button {
    font: inherit;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.small { padding: 4px 10px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .source-doc {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 10px;
  }
  .source-doc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .source-doc-header .title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .status-line { font-size: 13px; margin-top: 10px; color: var(--muted); }
  .status-line.error { color: var(--danger); }
  .status-line.ok { color: var(--ok); }
  pre.result {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
    overflow: auto;
    margin-top: 10px;
  }
  .report {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    margin-top: 10px;
    font-size: 13.5px;
  }
  .report h3 { font-size: 16px; margin: 0 0 10px; }
  .report h4 {
    font-size: 12px;
    margin: 16px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .report h4:first-of-type { margin-top: 4px; }
  .report p { margin: 0 0 10px; white-space: pre-wrap; }
  .report ul { margin: 0; padding-left: 20px; }
  .report li { margin: 2px 0; word-break: break-all; }
  .view-toggle button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .badge.queued, .badge.waiting { background: #fff3cd; color: #7a5b00; }
  .badge.processing { background: #cfe2ff; color: #084298; }
  .badge.succeeded { background: #d1f2dd; color: #0f5132; }
  .badge.failed { background: #f8d7da; color: #842029; }
  @media (prefers-color-scheme: dark) {
    .badge.queued, .badge.waiting { background: #4a3d00; color: #ffe58a; }
    .badge.processing { background: #082b5e; color: #9ec5ff; }
    .badge.succeeded { background: #103d22; color: #7fe0a3; }
    .badge.failed { background: #4a1116; color: #ff9aa3; }
  }
  ul.recent { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  ul.recent li { padding: 4px 0; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  ul.recent li:first-child { border-top: none; }
  ul.recent a { color: var(--accent); cursor: pointer; text-decoration: none; }
  ul.recent a:hover { text-decoration: underline; }
  code { font-family: var(--mono); }
</style>
</head>
<body>

<header>
  <h1>financeAgentJobQueue</h1>
  <p>Submit extraction/research jobs and check their status. Thin client over the job queue API — no auth, personal use.</p>
</header>

<main>

  <section class="panel" id="extraction-panel">
    <h2>Submit extraction job</h2>
    <label for="ex-type">Document type</label>
    <input type="text" id="ex-type" value="earnings release" placeholder="earnings release, earnings call transcript, ...">
    <label for="ex-text">Document text</label>
    <textarea id="ex-text" placeholder="Paste the earnings release / call transcript text here..."></textarea>
    <div class="row">
      <button class="primary" id="ex-submit">Submit extraction job</button>
      <span class="status-line" id="ex-status"></span>
    </div>
  </section>

  <section class="panel" id="research-panel">
    <h2>Submit research job</h2>
    <label for="rs-company">Company name</label>
    <input type="text" id="rs-company" placeholder="Acme Corp">
    <label>Source documents (optional — extracted first, then fed into research)</label>
    <div id="rs-docs"></div>
    <div class="row">
      <button class="secondary small" id="rs-add-doc">+ Add source document</button>
    </div>
    <div class="row">
      <button class="primary" id="rs-submit">Submit research job</button>
      <span class="status-line" id="rs-status"></span>
    </div>
  </section>

  <section class="panel" id="status-panel">
    <h2>Check job status</h2>
    <label for="job-id">Job ID</label>
    <input type="text" id="job-id" placeholder="paste a jobId or pick one from Recent jobs below">
    <div class="row">
      <button class="primary" id="job-check">Check now</button>
      <label style="display:inline-flex;align-items:center;gap:6px;margin:0;color:var(--text);font-size:13px;">
        <input type="checkbox" id="job-autopoll" style="width:auto;"> auto-refresh every 3s until done
      </label>
      <span class="status-line" id="job-status"></span>
    </div>
    <div class="row view-toggle" id="job-result-controls" style="display:none;">
      <button class="secondary small" id="view-formatted" type="button">Formatted</button>
      <button class="secondary small" id="view-raw" type="button">Raw JSON</button>
      <button class="secondary small" id="download-report" type="button" style="display:none;">Download report</button>
    </div>
    <div class="report" id="job-report" style="display:none;"></div>
    <pre class="result" id="job-result" style="display:none;"></pre>
  </section>

  <section class="panel" id="recent-panel">
    <h2>Recent jobs (this browser only)</h2>
    <ul class="recent" id="recent-list"><li style="color:var(--muted)">Nothing submitted yet.</li></ul>
  </section>

</main>

<script>
// Hardcoded on purpose — this is a single static file with no build step.
// Update this if the API Gateway is ever redeployed under a new URL.
const API_URL = "***REDACTED-API-URL***";

const RECENT_KEY = "financeAgentJobQueue.recentJobs";
let pollTimer = null;

function loadRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); }
  catch { return []; }
}

function saveRecent(list) {
  localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 20)));
}

function addRecent(jobId, type) {
  const list = loadRecent().filter((j) => j.jobId !== jobId);
  list.unshift({ jobId, type, at: new Date().toISOString() });
  saveRecent(list);
  renderRecent();
}

function renderRecent() {
  const list = loadRecent();
  const el = document.getElementById("recent-list");
  if (list.length === 0) {
    el.innerHTML = '<li style="color:var(--muted)">Nothing submitted yet.</li>';
    return;
  }
  el.innerHTML = list.map((j) => `
    <li>
      <span><a data-jobid="${j.jobId}">${j.jobId}</a> <span style="color:var(--muted)">(${j.type})</span></span>
      <span style="color:var(--muted)">${new Date(j.at).toLocaleString()}</span>
    </li>
  `).join("");
  el.querySelectorAll("a[data-jobid]").forEach((a) => {
    a.addEventListener("click", () => {
      document.getElementById("job-id").value = a.dataset.jobid;
      checkJob();
    });
  });
}

async function submitJob(body) {
  const res = await fetch(`${API_URL}/jobs`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// --- Research report rendering (formatted view + downloadable markdown) ---

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function renderReportHtml(report) {
  const parts = [];
  const title = escapeHtml(report.companyName || "Untitled")
    + (report.fiscalPeriodCovered ? " — " + escapeHtml(report.fiscalPeriodCovered) : "");
  parts.push(`<h3>${title}</h3>`);

  if (report.executiveSummary) {
    parts.push(`<p>${escapeHtml(report.executiveSummary).replace(/\n/g, "<br>")}</p>`);
  }
  for (const section of report.sections || []) {
    parts.push(`<h4>${escapeHtml(section.heading)}</h4>`);
    parts.push(`<p>${escapeHtml(section.content).replace(/\n/g, "<br>")}</p>`);
  }
  if (report.sourcesUsed && report.sourcesUsed.length) {
    parts.push("<h4>Sources</h4>");
    parts.push(`<ul>${report.sourcesUsed.map((s) => `<li>${escapeHtml(s)}</li>`).join("")}</ul>`);
  }
  return parts.join("\n");
}

function renderReportMarkdown(report) {
  const lines = [];
  lines.push(`# ${report.companyName || "Untitled"}${report.fiscalPeriodCovered ? " — " + report.fiscalPeriodCovered : ""}`, "");
  if (report.executiveSummary) {
    lines.push("## Executive Summary", "", report.executiveSummary, "");
  }
  for (const section of report.sections || []) {
    lines.push(`## ${section.heading}`, "", section.content, "");
  }
  if (report.sourcesUsed && report.sourcesUsed.length) {
    lines.push("## Sources", "", ...report.sourcesUsed.map((s) => `- ${s}`), "");
  }
  return lines.join("\n");
}

function downloadReportMarkdown(report) {
  const markdown = renderReportMarkdown(report);
  const blob = new Blob([markdown], { type: "text/markdown" });
  const url = URL.createObjectURL(blob);
  const safeName = (report.companyName || "report").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  const a = document.createElement("a");
  a.href = url;
  a.download = `${safeName || "report"}-research-report.md`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// --- Job result display: toggles between the formatted report (research
// jobs only, once succeeded) and the raw job JSON. ---

let lastJobData = null;
let lastCheckedJobId = null;
let reportView = "formatted";

function updateResultDisplay() {
  const controls = document.getElementById("job-result-controls");
  const reportEl = document.getElementById("job-report");
  const rawEl = document.getElementById("job-result");
  const downloadBtn = document.getElementById("download-report");
  const formattedBtn = document.getElementById("view-formatted");
  const rawBtn = document.getElementById("view-raw");

  if (!lastJobData) {
    controls.style.display = "none";
    reportEl.style.display = "none";
    rawEl.style.display = "none";
    return;
  }

  const hasReport = lastJobData.status === "succeeded" && lastJobData.type === "research" && lastJobData.result;
  if (!hasReport) reportView = "raw"; // nothing to format for extraction jobs / not-yet-succeeded jobs

  controls.style.display = "flex";
  formattedBtn.style.display = hasReport ? "" : "none";
  downloadBtn.style.display = hasReport ? "" : "none";
  formattedBtn.classList.toggle("active", reportView === "formatted");
  rawBtn.classList.toggle("active", reportView === "raw");

  if (reportView === "formatted" && hasReport) {
    reportEl.innerHTML = renderReportHtml(lastJobData.result);
    reportEl.style.display = "block";
    rawEl.style.display = "none";
  } else {
    rawEl.textContent = JSON.stringify(lastJobData, null, 2);
    rawEl.style.display = "block";
    reportEl.style.display = "none";
  }
}

document.getElementById("view-formatted").addEventListener("click", () => { reportView = "formatted"; updateResultDisplay(); });
document.getElementById("view-raw").addEventListener("click", () => { reportView = "raw"; updateResultDisplay(); });
document.getElementById("download-report").addEventListener("click", () => {
  if (lastJobData?.result) downloadReportMarkdown(lastJobData.result);
});

// --- Extraction form ---
document.getElementById("ex-submit").addEventListener("click", async () => {
  const status = document.getElementById("ex-status");
  const documentText = document.getElementById("ex-text").value.trim();
  const documentType = document.getElementById("ex-type").value.trim();

  if (!documentText) {
    status.textContent = "documentText is required";
    status.className = "status-line error";
    return;
  }

  status.textContent = "Submitting...";
  status.className = "status-line";
  try {
    const job = await submitJob({ type: "extraction", input: { documentText, documentType } });
    status.textContent = `Submitted — jobId ${job.jobId} (status: ${job.status})`;
    status.className = "status-line ok";
    addRecent(job.jobId, "extraction");
    document.getElementById("job-id").value = job.jobId;
    document.getElementById("job-autopoll").checked = true;
    checkJob();
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
    status.className = "status-line error";
  }
});

// --- Research form ---
let sourceDocCount = 0;

function addSourceDocRow() {
  sourceDocCount += 1;
  const id = sourceDocCount;
  const wrapper = document.createElement("div");
  wrapper.className = "source-doc";
  wrapper.dataset.docId = id;
  wrapper.innerHTML = `
    <div class="source-doc-header">
      <span class="title">Source document ${id}</span>
      <button class="secondary small remove" data-remove="${id}" type="button">Remove</button>
    </div>
    <label>Document type</label>
    <input type="text" class="doc-type" value="earnings release">
    <label>Document text</label>
    <textarea class="doc-text" placeholder="Paste source document text..."></textarea>
  `;
  document.getElementById("rs-docs").appendChild(wrapper);
  wrapper.querySelector(`[data-remove="${id}"]`).addEventListener("click", () => wrapper.remove());
}

document.getElementById("rs-add-doc").addEventListener("click", addSourceDocRow);

document.getElementById("rs-submit").addEventListener("click", async () => {
  const status = document.getElementById("rs-status");
  const companyName = document.getElementById("rs-company").value.trim();

  if (!companyName) {
    status.textContent = "companyName is required";
    status.className = "status-line error";
    return;
  }

  const sourceDocuments = Array.from(document.querySelectorAll("#rs-docs .source-doc"))
    .map((row) => ({
      documentType: row.querySelector(".doc-type").value.trim(),
      documentText: row.querySelector(".doc-text").value.trim(),
    }))
    .filter((doc) => doc.documentText);

  status.textContent = "Submitting...";
  status.className = "status-line";
  try {
    const job = await submitJob({ type: "research", input: { companyName }, sourceDocuments });
    status.textContent = `Submitted — jobId ${job.jobId} (status: ${job.status})`;
    status.className = "status-line ok";
    addRecent(job.jobId, "research");
    document.getElementById("job-id").value = job.jobId;
    document.getElementById("job-autopoll").checked = true;
    checkJob();
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
    status.className = "status-line error";
  }
});

// --- Status lookup ---
async function checkJob() {
  const jobId = document.getElementById("job-id").value.trim();
  const status = document.getElementById("job-status");
  if (!jobId) {
    status.textContent = "Enter a job ID first";
    status.className = "status-line error";
    return;
  }

  // Switching to a different job resets the view back to formatted —
  // otherwise it'd stay stuck on "Raw JSON" from whatever the last job left it at.
  if (jobId !== lastCheckedJobId) {
    reportView = "formatted";
    lastCheckedJobId = jobId;
  }

  status.textContent = "Checking...";
  status.className = "status-line";
  try {
    const res = await fetch(`${API_URL}/jobs/${encodeURIComponent(jobId)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    const badge = `<span class="badge ${data.status}">${data.status}</span>`;
    status.innerHTML = `${badge} ${data.type} — last updated ${new Date(data.updatedAt).toLocaleString()}`;
    status.className = "status-line";

    lastJobData = data;
    updateResultDisplay();

    const terminal = data.status === "succeeded" || data.status === "failed";
    if (terminal && pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
    return terminal;
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
    status.className = "status-line error";
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
}

document.getElementById("job-check").addEventListener("click", checkJob);

document.getElementById("job-autopoll").addEventListener("change", (e) => {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (e.target.checked) {
    pollTimer = setInterval(checkJob, 3000);
  }
});

renderRecent();
</script>

</body>
</html>
